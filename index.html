<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="base:app_id" content="6a15a41de2595c07fbb7fdfa" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base ETH to USDC Swap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .swap-card { background: #161b22; padding: 25px; border-radius: 20px; width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #30363d; }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #0052ff; }
        .input-box { background: #21262d; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #30363d; }
        .input-box label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 5px; }
        .input-box input { width: 100%; background: transparent; border: none; color: white; font-size: 20px; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0052ff; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0040cc; }
        #connectBtn { background: #238636; margin-bottom: 10px; }
        #connectBtn:hover { background: #2ea043; }
        #status { margin-top: 15px; font-size: 13px; color: #58a6ff; text-align: center; word-break: break-all; }
        .balance { font-size: 12px; color: #8b949e; margin-bottom: 10px; text-align: right; }
    </style>
</head>
<body>
    <div class="swap-card">
        <h2>Base Swap (ETH ➔ USDC)</h2>
        <div class="balance" id="balanceDisplay">Bakiye: Bağlı Değil</div>
        
        <div class="input-box">
            <label>Ödeyeceğin (ETH)</label>
            <input type="number" id="ethAmount" placeholder="0.01" step="0.001">
        </div>

        <div class="input-box">
            <label>Alacağın (Tahmini USDC)</label>
            <input type="text" id="usdcAmount" placeholder="0.00" disabled>
        </div>

        <button id="connectBtn">Cüzdanı Bağla</button>
        <button id="swapBtn" style="display:none;">Swap Yap</button>
        <div id="status"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
